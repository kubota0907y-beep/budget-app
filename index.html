<script>
    // アイコン用のSVG（Lucide icons の代替）
    const Icons = {
        Plus: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`,
        Trash2: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
        TrendingUp: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>`,
        TrendingDown: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>`,
        Calendar: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`,
        BarChart3: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>`
    };

    class BudgetApp {
        constructor() {
            this.entries = [];
            this.amount = '';
            this.category = '食費';
            this.type = '支出';
            this.memo = '';
            this.viewMode = 'input';
            this.summaryPeriod = 'month';
            this.categories = {
                支出: ['食費', '交通費', '日用品', '娯楽', '住宅ローン', '車ローン', '保険料', '携帯代金', '電気代', '塾代', '貯蓄', '投資信託', 'その他'],
                収入: ['給料', 'ボーナス', 'その他'],
                貯蓄: ['定期預金', '積立NISA', '株式', '投資信託', 'その他'],
                投資信託: ['国内株式型', '海外株式型', 'バランス型', 'インデックス型', 'その他']
            };
            this.init();
        }

        async init() {
            await this.loadData();
            this.render();
        }

        async loadData() {
            try {
                const saved = localStorage.getItem('budgetEntries');
                if (saved) {
                    this.entries = JSON.parse(saved);
                }
            } catch (error) {
                console.log('データ読み込みエラー:', error);
            }
        }

        async saveData() {
            try {
                localStorage.setItem('budgetEntries', JSON.stringify(this.entries));
            } catch (error) {
                console.error('データ保存エラー:', error);
                alert('データの保存に失敗しました');
            }
        }

        async addEntry() {
            if (!this.amount || isNaN(this.amount)) return;

            const newEntry = {
                id: Date.now(),
                date: new Date().toLocaleString('ja-JP', {
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                }),
                fullDate: new Date().toISOString(),
                type: this.type,
                category: this.category,
                amount: parseFloat(this.amount),
                memo: this.memo
            };

            this.entries.unshift(newEntry);

            if (this.type === '支出' && this.category === '貯蓄') {
                const savingsEntry = {
                    id: Date.now() + 1,
                    date: newEntry.date,
                    fullDate: newEntry.fullDate,
                    type: '貯蓄',
                    category: '定期預金',
                    amount: parseFloat(this.amount),
                    memo: this.memo || '支出からの自動振替'
                };
                this.entries.unshift(savingsEntry);
            } else if (this.type === '支出' && this.category === '投資信託') {
                const investmentEntry = {
                    id: Date.now() + 1,
                    date: newEntry.date,
                    fullDate: newEntry.fullDate,
                    type: '投資信託',
                    category: 'インデックス型',
                    amount: parseFloat(this.amount),
                    memo: this.memo || '支出からの自動振替'
                };
                this.entries.unshift(investmentEntry);
            }

            await this.saveData();
            this.amount = '';
            this.memo = '';
            this.render();
        }

        async deleteEntry(id) {
            this.entries = this.entries.filter(e => e.id !== id);
            await this.saveData();
            this.render();
        }

        changeType(newType) {
            this.type = newType;
            this.category = this.categories[newType][0];
            this.render();
        }

        getSummary() {
            const income = this.entries.filter(e => e.type === '収入').reduce((sum, e) => sum + e.amount, 0);
            const expense = this.entries.filter(e => e.type === '支出').reduce((sum, e) => sum + e.amount, 0);
            const savings = this.entries.filter(e => e.type === '貯蓄').reduce((sum, e) => sum + e.amount, 0);
            const investment = this.entries.filter(e => e.type === '投資信託').reduce((sum, e) => sum + e.amount, 0);
            const total = income - expense;

            return { income, expense, savings, investment, total };
        }

        getSummaryData() {
            const grouped = {};

            this.entries.forEach(entry => {
                const date = new Date(entry.fullDate);
                const key = this.summaryPeriod === 'month'
                    ? `${date.getFullYear()}年${String(date.getMonth() + 1).padStart(2, '0')}月`
                    : `${date.getFullYear()}年`;

                if (!grouped[key]) {
                    grouped[key] = {
                        収入: 0,
                        支出: 0,
                        貯蓄: 0,
                        投資信託: 0,
                        expenseByCategory: {}
                    };
                }

                if (entry.type === '収入') grouped[key].収入 += entry.amount;
                else if (entry.type === '支出') {
                    grouped[key].支出 += entry.amount;
                    grouped[key].expenseByCategory[entry.category] =
                        (grouped[key].expenseByCategory[entry.category] || 0) + entry.amount;
                }
                else if (entry.type === '貯蓄') grouped[key].貯蓄 += entry.amount;
                else if (entry.type === '投資信託') grouped[key].投資信託 += entry.amount;
            });

            return Object.entries(grouped).sort((a, b) => b[0].localeCompare(a[0]));
        }

        render() {
            const summary = this.getSummary();
            const summaryData = this.getSummaryData();

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="max-w-2xl mx-auto">
                    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">💰 簡単家計簿</h1>

                    <!-- モード切替 -->
                    <div class="bg-white rounded-xl shadow-lg p-4 mb-6">
                        <div class="flex gap-2">
                            <button onclick="app.viewMode='input'; app.render()" 
                                class="flex-1 py-2 px-4 rounded-lg font-medium transition flex items-center justify-center gap-2 ${this.viewMode === 'input' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-600'}">
                                ${Icons.Plus} 入力
                            </button>
                            <button onclick="app.viewMode='summary'; app.render()" 
                                class="flex-1 py-2 px-4 rounded-lg font-medium transition flex items-center justify-center gap-2 ${this.viewMode === 'summary' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-600'}">
                                ${Icons.BarChart3} 集計
                            </button>
                        </div>
                    </div>

                    ${this.viewMode === 'input' ? this.renderInputView(summary) : this.renderSummaryView(summaryData)}
                </div>
            `;
        }

        renderInputView(summary) {
            return `
                <!-- サマリー -->
                <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                    <div class="grid grid-cols-5 gap-2 text-center">
                        <div class="bg-green-50 rounded-lg p-2">
                            <div class="flex items-center justify-center text-green-600 mb-1">
                                ${Icons.TrendingUp}<span class="text-xs ml-1">収入</span>
                            </div>
                            <div class="text-sm font-bold text-green-700">¥${summary.income.toLocaleString()}</div>
                        </div>
                        <div class="bg-red-50 rounded-lg p-2">
                            <div class="flex items-center justify-center text-red-600 mb-1">
                                ${Icons.TrendingDown}<span class="text-xs ml-1">支出</span>
                            </div>
                            <div class="text-sm font-bold text-red-700">¥${summary.expense.toLocaleString()}</div>
                        </div>
                        <div class="bg-purple-50 rounded-lg p-2">
                            <div class="text-xs text-purple-600 mb-1">貯蓄</div>
                            <div class="text-sm font-bold text-purple-700">¥${summary.savings.toLocaleString()}</div>
                        </div>
                        <div class="bg-orange-50 rounded-lg p-2">
                            <div class="text-xs text-orange-600 mb-1">投信</div>
                            <div class="text-sm font-bold text-orange-700">¥${summary.investment.toLocaleString()}</div>
                        </div>
                        <div class="bg-blue-50 rounded-lg p-2">
                            <div class="text-xs text-blue-600 mb-1">残高</div>
                            <div class="text-sm font-bold ${summary.total >= 0 ? 'text-blue-700' : 'text-red-700'}">¥${summary.total.toLocaleString()}</div>
                        </div>
                    </div>
                </div>

                <!-- 入力フォーム -->
                <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                    <div class="space-y-4">
                        <div class="flex gap-2">
                            ${['支出', '収入', '貯蓄', '投資信託'].map((t, i) => {
                                const colors = ['red', 'green', 'purple', 'orange'];
                                const labels = ['支出', '収入', '貯蓄', '投信'];
                                return `<button onclick="app.changeType('${t}')" 
                                    class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition ${this.type === t ? `bg-${colors[i]}-500 text-white` : 'bg-gray-100 text-gray-600'}">
                                    ${labels[i]}
                                </button>`;
                            }).join('')}
                        </div>

                        <input type="number" id="amount" value="${this.amount}" 
                            oninput="app.amount=this.value"
                            placeholder="金額" 
                            class="w-full p-3 border-2 border-gray-200 rounded-lg text-lg focus:border-blue-500 focus:outline-none">

                        <select id="category" onchange="app.category=this.value" 
                            class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none">
                            ${this.categories[this.type].map(cat => 
                                `<option value="${cat}" ${this.category === cat ? 'selected' : ''}>${cat}</option>`
                            ).join('')}
                        </select>

                        <input type="text" id="memo" value="${this.memo}" 
                            oninput="app.memo=this.value"
                            placeholder="メモ（任意）" 
                            class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none">

                        <button onclick="app.addEntry()" 
                            class="w-full bg-blue-500 text-white py-3 px-4 rounded-lg font-medium flex items-center justify-center gap-2 hover:bg-blue-600 transition">
                            ${Icons.Plus} 追加
                        </button>
                    </div>
                </div>

                <!-- 履歴 -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        ${Icons.Calendar} 履歴
                    </h2>
                    ${this.entries.length === 0 ? 
                        '<p class="text-gray-400 text-center py-8">まだ記録がありません</p>' :
                        `<div class="space-y-2">
                            ${this.entries.map(entry => `
                                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="px-2 py-1 rounded text-xs font-medium ${
                                                entry.type === '収入' ? 'bg-green-100 text-green-700' :
                                                entry.type === '貯蓄' ? 'bg-purple-100 text-purple-700' :
                                                entry.type === '投資信託' ? 'bg-orange-100 text-orange-700' :
                                                'bg-red-100 text-red-700'
                                            }">${entry.category}</span>
                                            <span class="text-xs text-gray-500">${entry.date}</span>
                                        </div>
                                        ${entry.memo ? `<div class="text-sm text-gray-600">${entry.memo}</div>` : ''}
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="text-lg font-bold ${
                                            entry.type === '収入' ? 'text-green-600' :
                                            entry.type === '貯蓄' ? 'text-purple-600' :
                                            entry.type === '投資信託' ? 'text-orange-600' :
                                            'text-red-600'
                                        }">
                                            ${entry.type === '収入' ? '+' : entry.type === '貯蓄' ? '💰' : entry.type === '投資信託' ? '📈' : '-'}¥${entry.amount.toLocaleString()}
                                        </span>
                                        <button onclick="app.deleteEntry(${entry.id})" 
                                            class="text-red-400 hover:text-red-600 transition">
                                            ${Icons.Trash2}
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>`
                    }
                </div>
            `;
        }

        renderSummaryView(summaryData) {
            return `
                <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                    <div class="flex gap-2 mb-6">
                        <button onclick="app.summaryPeriod='month'; app.render()" 
                            class="flex-1 py-2 px-4 rounded-lg font-medium transition ${this.summaryPeriod === 'month' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-600'}">
                            月別
                        </button>
                        <button onclick="app.summaryPeriod='year'; app.render()" 
                            class="flex-1 py-2 px-4 rounded-lg font-medium transition ${this.summaryPeriod === 'year' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-600'}">
                            年別
                        </button>
                    </div>

                    ${summaryData.length === 0 ?
                        '<p class="text-gray-400 text-center py-8">まだ記録がありません</p>' :
                        `<div class="space-y-6">
                            ${summaryData.map(([period, data]) => {
                                const balance = data.収入 - data.支出;
                                return `
                                    <div class="border-2 border-gray-200 rounded-lg p-4">
                                        <h3 class="text-lg font-bold text-gray-800 mb-4">${period}</h3>
                                        <div class="grid grid-cols-5 gap-2 mb-4 text-center">
                                            <div class="bg-green-50 rounded-lg p-2">
                                                <div class="text-xs text-green-600 mb-1">収入</div>
                                                <div class="text-sm font-bold text-green-700">¥${data.収入.toLocaleString()}</div>
                                            </div>
                                            <div class="bg-red-50 rounded-lg p-2">
                                                <div class="text-xs text-red-600 mb-1">支出</div>
                                                <div class="text-sm font-bold text-red-700">¥${data.支出.toLocaleString()}</div>
                                            </div>
                                            <div class="bg-purple-50 rounded-lg p-2">
                                                <div class="text-xs text-purple-600 mb-1">貯蓄</div>
                                                <div class="text-sm font-bold text-purple-700">¥${data.貯蓄.toLocaleString()}</div>
                                            </div>
                                            <div class="bg-orange-50 rounded-lg p-2">
                                                <div class="text-xs text-orange-600 mb-1">投信</div>
                                                <div class="text-sm font-bold text-orange-700">¥${data.投資信託.toLocaleString()}</div>
                                            </div>
                                            <div class="bg-blue-50 rounded-lg p-2">
                                                <div class="text-xs text-blue-600 mb-1">残高</div>
                                                <div class="text-sm font-bold ${balance >= 0 ? 'text-blue-700' : 'text-red-700'}">¥${balance.toLocaleString()}</div>
                                            </div>
                                        </div>
                                        ${Object.keys(data.expenseByCategory).length > 0 ? `
                                            <div class="bg-gray-50 rounded-lg p-3">
                                                <div class="text-xs font-semibold text-gray-600 mb-2">支出内訳</div>
                                                <div class="space-y-1">
                                                    ${Object.entries(data.expenseByCategory)
                                                        .sort((a, b) => b[1] - a[1])
                                                        .map(([cat, amt]) => `
                                                            <div class="flex justify-between text-sm">
                                                                <span class="text-gray-600">${cat}</span>
                                                                <span class="font-medium text-gray-800">¥${amt.toLocaleString()}</span>
                                                            </div>
                                                        `).join('')}
                                                </div>
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>`
                    }
                </div>
            `;
        }
    }

    // アプリ起動
    const app = new BudgetApp();
</script>
